<app-header></app-header>

<div class="container-fluid mt-4">
  <div class="row">

  
    <aside class="col-md-3 col-lg-2">
      <div
        class="user-card mb-3 p-3 rounded-4 d-flex align-items-center gap-3"
        *ngFor="let user of usuarios"
        (click)="seleccionarUsuario(user)"
        [class.active]="usuarioSeleccionado?.nombre === user.nombre"
      >
        <img [src]="user.avatar" class="avatar" />
        <span>{{ user.nombre }}</span>
      </div>
    </aside>

  
    <main class="col-md-9 col-lg-10 d-flex align-items-center">
      <h2 class="display-5 fw-bold text-purple" *ngIf="usuarioSeleccionado">
        {{ usuarioSeleccionado.nombre }}
      </h2>
    </main>

  </div>
</div>
